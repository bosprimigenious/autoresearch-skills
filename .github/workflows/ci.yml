name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py
      - run: python scripts/sync_formats.py --check
      - run: python scripts/privacy_scan.py
      - run: python scripts/validate_route_evals.py
      - run: python scripts/build_qa_release.py --out-dir /tmp/autoresearch-qa-release
      - run: python -m unittest discover -s skills/autoresearch-task-qa/scripts -p 'test_*.py'
      - run: python -m unittest discover -s skills/autoresearch-paper-discovery/scripts -p 'test_*.py'
      - run: python -m unittest discover -s skills/autoresearch-run-isolation/scripts -p 'test_*.py'
      - run: python -m unittest discover -s skills/autoresearch-task-authoring/scripts -p 'test_*.py'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
